name: Base install

# `pip install geotoolz` without extras must import and run: every module-scope
# import is a declared base dependency, and extra-backed operators fail only
# when used, with an ImportError naming the extra. tests/test_packaging.py
# checks this statically; this job checks it against a real slim environment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  geotoolz-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Only geotoolz and its base dependencies from the lockfile: no extras,
      # no dependency groups, no other workspace members.
      - name: Install geotoolz (base, no extras)
        run: uv sync --locked --package geotoolz --no-default-groups
      - name: Import and smoke test
        run: |
          uv run --no-sync python - <<'EOF'
          import importlib
          import importlib.util
          import pkgutil

          import numpy as np
          from georeader.geotensor import GeoTensor
          from rasterio.transform import from_origin

          import geotoolz as gz

          # The extras really are absent from this environment.
          for module in ("matplotlib", "sklearn", "joblib", "zarr", "xvec", "hydra_zen"):
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          # Every module imports on a base install (patch_ops is the
          # documented exception: it is itself the [patch] extra's entry point).
          for info in pkgutil.walk_packages(gz.__path__, "geotoolz."):
              if info.name != "geotoolz.patch_ops":
                  importlib.import_module(info.name)

          values = np.arange(32, dtype="float32").reshape(2, 4, 4) + 1.0
          gt = GeoTensor(
              values, transform=from_origin(0, 40, 10, 10), crs="EPSG:32629",
              fill_value_default=-9999.0,
          )
          out = gz.NormalizedDifference(a=1, b=0)(gt)
          assert out.shape == (4, 4), out.shape

          # Extra-backed operators construct fine and fail only on use,
          # naming the extra to install.
          op = gz.ApplyColormap(name="viridis")
          try:
              op(out)
          except ImportError as exc:
              assert "geotoolz[viz]" in str(exc), exc
          else:
              raise AssertionError("ApplyColormap ran without matplotlib")
          print("geotoolz base install OK")
          EOF
