name: Base install

# `pip install geotoolz` without extras must import and run: every module-scope
# import is a declared base dependency, and extra-backed operators fail only
# when used, with an ImportError naming the extra. tests/test_packaging.py
# checks this statically; this job checks it against a real slim environment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  geotoolz-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # Only geotoolz and its base dependencies from the lockfile: no extras,
      # no dependency groups, no other workspace members.
      - name: Install geotoolz (base, no extras)
        run: uv sync --locked --package geotoolz --no-default-groups
      - name: Import and smoke test
        run: |
          uv run --no-sync python - <<'EOF'
          import importlib
          import importlib.util
          import pkgutil

          import numpy as np
          from georeader.geotensor import GeoTensor
          from rasterio.transform import from_origin

          import geotoolz as gz

          # The extras really are absent from this environment.
          for module in ("matplotlib", "sklearn", "joblib", "zarr", "xvec", "hydra_zen"):
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          # Every module imports on a base install (patch_ops is the
          # documented exception: it is itself the [patch] extra's entry point).
          for info in pkgutil.walk_packages(gz.__path__, "geotoolz."):
              if info.name != "geotoolz.patch_ops":
                  importlib.import_module(info.name)

          values = np.arange(32, dtype="float32").reshape(2, 4, 4) + 1.0
          gt = GeoTensor(
              values, transform=from_origin(0, 40, 10, 10), crs="EPSG:32629",
              fill_value_default=-9999.0,
          )
          out = gz.NormalizedDifference(a=1, b=0)(gt)
          assert out.shape == (4, 4), out.shape

          # Extra-backed operators construct fine and fail only on use,
          # naming the extra to install.
          op = gz.ApplyColormap(name="viridis")
          try:
              op(out)
          except ImportError as exc:
              assert "geotoolz[viz]" in str(exc), exc
          else:
              raise AssertionError("ApplyColormap ran without matplotlib")
          print("geotoolz base install OK")
          EOF

  # `pip install geotoolz-catalog` without extras: every module imports, the
  # in-memory catalog builds / writes / reopens, extra-backed features fail
  # only when used with a hint naming the `geotoolz-catalog[...]` extra, and
  # the test suite passes with every extras-gated test skipping cleanly.
  # (ci.yml runs the same suite with every extra installed.)
  geotoolz-catalog-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # geotoolz-catalog's base dependencies plus its own `dev` group (pytest,
      # hypothesis) — no extras, no other workspace members.
      - name: Install geotoolz-catalog (base, no extras)
        run: uv sync --locked --package geotoolz-catalog --no-default-groups --group dev
      - name: Import and smoke test
        run: |
          uv run --no-sync geocatalog --version
          uv run --no-sync python - <<'PY'
          import importlib
          import importlib.util
          import pkgutil
          import tempfile
          from pathlib import Path

          import numpy as np
          import rasterio
          from rasterio.transform import from_origin

          import geocatalog

          # The extras really are absent from this environment.
          for module in (
              "fsspec", "duckdb", "xarray", "zarr", "pystac", "pystac_client",
              "planetary_computer", "earthaccess", "ee", "geopatcher", "geocloud",
          ):
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          # Every module imports on a base install.
          for info in pkgutil.walk_packages(geocatalog.__path__, "geocatalog."):
              importlib.import_module(info.name)

          with tempfile.TemporaryDirectory() as tmp:
              tif = Path(tmp) / "S2_20240601.tif"
              with rasterio.open(
                  tif, "w", driver="GTiff", width=8, height=8, count=1,
                  dtype="uint8", crs="EPSG:32629",
                  transform=from_origin(500000, 4000080, 10, 10),
              ) as dst:
                  dst.write(np.ones((1, 8, 8), dtype="uint8"))
              cat = geocatalog.build.build_raster_catalog(
                  [tif], filename_regex=r"(?P<date>\d{8})"
              )
              assert len(cat) == 1, len(cat)
              out = Path(tmp) / "catalog.parquet"
              geocatalog.storage.to_geoparquet(cat, out)
              assert len(geocatalog.open_catalog(out)) == 1

              # Extra-backed features fail only on use, naming the extra.
              try:
                  geocatalog.open_catalog(out, engine="duckdb")
              except ImportError as exc:
                  assert "geotoolz-catalog[duckdb]" in str(exc), exc
              else:
                  raise AssertionError("engine='duckdb' ran without duckdb")
          print("geotoolz-catalog base install OK", geocatalog.__version__)
          PY
      # Coverage is off: most extras-gated code is unreachable here, so the
      # package's fail_under floor is for the all-extras run in ci.yml.
      - name: Test geotoolz-catalog (base install)
        working-directory: packages/geotoolz-catalog
        run: uv run --no-sync pytest -q --no-cov -m "not live and not slow"

  # `pip install geotoolz-patcher` without extras: every module imports
  # (bar the [pipekit] bridge, which is itself that extra's entry point),
  # a RasterField splits and merges, extra-backed features fail only when
  # used with a hint naming the `geotoolz-patcher[...]` extra, and the test
  # suite passes with every extras-gated test skipping cleanly. (ci.yml
  # runs the same suite with every extra installed.)
  geotoolz-patcher-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # geotoolz-patcher's base dependencies plus its own `dev` group
      # (pytest, hypothesis) — no extras, no other workspace members.
      - name: Install geotoolz-patcher (base, no extras)
        run: uv sync --locked --package geotoolz-patcher --no-default-groups --group dev
      - name: Import and smoke test
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          import importlib.util
          import pkgutil

          import numpy as np
          from georeader.geotensor import GeoTensor
          from rasterio.transform import from_origin

          import geopatcher as gp

          # The extras really are absent from this environment.
          for module in (
              "xarray", "rioxarray", "xvec", "zarr", "dask", "jax",
              "geocloud", "obstore", "async_tiff", "async_geotiff", "pipekit",
          ):
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          # Every module imports on a base install.
          for info in pkgutil.walk_packages(gp.__path__, "geopatcher."):
              if info.name != "geopatcher.integrations.pipekit":
                  importlib.import_module(info.name)

          values = np.arange(2 * 16 * 16, dtype="float32").reshape(2, 16, 16)
          field = gp.RasterField(
              GeoTensor(values, transform=from_origin(0, 160, 10, 10), crs="EPSG:32629")
          )
          patcher = gp.SpatialPatcher(
              geometry=gp.spatial.geometry.Rectangular(size=(8, 8)),
              sampler=gp.spatial.sampler.RegularStride(step=(8, 8)),
              window=gp.spatial.window.Boxcar(),
              aggregation=gp.spatial.aggregation.OverlapAdd(),
          )
          out = patcher.merge(patcher.split(field), field.domain)
          np.testing.assert_allclose(out, values)

          # Extra-backed features fail only on use, naming the extra.
          try:
              gp.fields.XarrayField(object())
          except ImportError as exc:
              assert "geotoolz-patcher[grid]" in str(exc), exc
          else:
              raise AssertionError("XarrayField ran without xarray")
          try:
              gp.fields.CogField.open("s3://bucket/scene.tif")
          except ImportError as exc:
              assert "geotoolz-patcher[cog]" in str(exc), exc
          else:
              raise AssertionError("CogField opened without geotoolz-cloud")
          print("geotoolz-patcher base install OK", gp.__version__)
          PY
      # Coverage is off: most extras-gated code is unreachable here, so the
      # package's fail_under floor is for the all-extras run in ci.yml.
      - name: Test geotoolz-patcher (base install)
        working-directory: packages/geotoolz-patcher
        run: uv run --no-sync pytest -q --no-cov

  # `pip install geotoolz-products` without extras: every module imports,
  # the reference reader loads a GeoTensor, extra-backed features fail only
  # when used with a hint naming the `geotoolz-products[...]` extra, and the
  # test suite passes with every extras-gated test skipping cleanly.
  # Crucially, geotoolz itself is absent: readers never depend on it.
  geotoolz-products-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install geotoolz-products (base, no extras)
        run: uv sync --locked --package geotoolz-products --no-default-groups --group dev
      - name: Import and smoke test
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          import importlib.util
          import pkgutil

          import numpy as np
          from rasterio.windows import Window

          import geoproducts

          # The extras (and geotoolz itself) really are absent.
          absent = ("geotoolz", "geopatcher", "obstore", "pipekit", "requests", "pydantic", "h5py")
          for module in absent:
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          # Every module imports on a base install, except the extra-gated
          # carbonmapper subpackage, which must name its extra instead.
          try:
              importlib.import_module("geoproducts.carbonmapper")
          except ImportError as exc:
              assert "geotoolz-products[carbonmapper]" in str(exc), exc
          else:
              raise AssertionError("carbonmapper imported without its extra")
          for info in pkgutil.walk_packages(
              geoproducts.__path__,
              "geoproducts.",
              onerror=lambda name: None,
          ):
              if not info.name.startswith("geoproducts.carbonmapper"):
                  importlib.import_module(info.name)

          data = np.arange(4 * 8 * 8, dtype="float32").reshape(4, 8, 8)
          reader = geoproducts.toy_sensor.Reader("toy", data=data)
          chip = reader.read_from_window(Window(0, 0, 4, 4)).load()
          assert chip.shape == (4, 4, 4), chip.shape

          # Extra-backed features fail only on use, naming the extra.
          try:
              geoproducts.toy_sensor.NDVI()
          except ImportError as exc:
              assert "geotoolz-products[operators]" in str(exc), exc
          else:
              raise AssertionError("NDVI preset ran without geotoolz")
          try:
              geoproducts.goes.Reader("scene.nc")
          except ImportError as exc:
              assert "geotoolz-products[goes]" in str(exc), exc
          else:
              raise AssertionError("goes.Reader ran without h5py")
          try:
              geoproducts.himawari.L2Reader("cmsk.nc")
          except ImportError as exc:
              assert "geotoolz-products[himawari]" in str(exc), exc
          else:
              raise AssertionError("himawari.L2Reader ran without h5py")
          from datetime import datetime

          try:
              geoproducts.goes.aws.list_files(satellite="G19", start=datetime(2026, 1, 1))
          except ImportError as exc:
              assert "geotoolz-products[goes]" in str(exc), exc
          else:
              raise AssertionError("goes.aws listed a bucket without geotoolz-cloud")
          print("geotoolz-products base install OK", geoproducts.__version__)
          PY
      # Coverage is off: extras-gated paths are unreachable here, so the
      # package's fail_under floor is for the all-extras run in ci.yml.
      - name: Test geotoolz-products (base install)
        working-directory: packages/geotoolz-products
        run: uv run --no-sync pytest -q --no-cov -m "not slow and not live and not integration"

  # `pip install geotoolz-cloud` without extras: the client pool works,
  # every module imports, and COG reads fail only when used, naming the
  # `[cog]` extra; the test suite passes with the COG tests skipping.
  geotoolz-cloud-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install geotoolz-cloud (base, no extras)
        run: uv sync --locked --package geotoolz-cloud --no-default-groups --group dev
      - name: Import and smoke test
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util

          import geocloud
          from geocloud.cog import CogSource
          from geocloud.store import clear_obstore_pool, get_obstore, object_key

          for module in ("async_geotiff", "geopatcher", "geotoolz"):
              assert importlib.util.find_spec(module) is None, f"{module} installed"

          store = get_obstore("s3://bucket/a/b.tif")
          assert get_obstore("s3://bucket/c.tif") is store
          assert object_key("s3://bucket/a/b.tif") == "a/b.tif"
          clear_obstore_pool()
          try:
              CogSource.open("s3://bucket/a/b.tif")
          except ImportError as exc:
              assert "geotoolz-cloud[cog]" in str(exc), exc
          else:
              raise AssertionError("CogSource opened without async-geotiff")
          print("geotoolz-cloud base install OK", geocloud.__version__)
          PY
      - name: Test geotoolz-cloud (base install)
        working-directory: packages/geotoolz-cloud
        run: uv run --no-sync pytest -q --no-cov
