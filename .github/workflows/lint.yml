name: Lint & Format

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit; runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install lint dependencies
        run: uv sync --group lint
      - name: Run ruff check
        run: uv run --group lint ruff check .
      - name: Run ruff format check
        run: uv run --group lint ruff format --check .
