name: Docs

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: uv sync --group docs
      # --strict turns every warning (broken cross-reference, missing
      # nav target, unresolvable mkdocstrings identifier) into a failure,
      # so docs drift breaks the PR instead of the deployed site.
      - name: Build docs
        run: uv run --group docs mkdocs build --strict
