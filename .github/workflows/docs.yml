name: Docs

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit; runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the site can change: docs/, mkdocs.yml, any package's src
  # (mkdocstrings renders the docstrings), changelogs or READMEs
  # (scripts/ci_select.py).
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    name: mkdocs build --strict
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: uv sync --group docs
      # --strict turns every warning (broken cross-reference, missing
      # nav target, unresolvable mkdocstrings identifier) into a failure,
      # so docs drift breaks the PR instead of the deployed site.
      - name: Build docs
        run: uv run --group docs mkdocs build --strict
