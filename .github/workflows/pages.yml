name: Deploy Docs

on:
  push:
    branches: [main]
    # The site's inputs (the same rule as ci_select.py's docs build): a merge
    # that touches none of them would redeploy the same site.
    paths:
      - docs/**
      - mkdocs.yml
      - packages/*/src/**
      - packages/*/README.md
      - packages/*/CHANGELOG.md
      - pyproject.toml
      - uv.lock
      - scripts/build_docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install docs dependencies
        run: uv sync --group docs

      # BASE_URL is the project-pages subpath. mystmd prepends it to its own
      # links, and scripts/build_docs.py uses it when rewriting the
      # cross-generator links, so both halves agree on where the site is
      # mounted.
      - name: Build and verify the documentation site
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: uv run --group docs python scripts/build_docs.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  # A job of its own: deployed right after the upload, in one job, the artifact
  # was not listed yet ("Found 0 artifact(s)") and the deployment failed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
