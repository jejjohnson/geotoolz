name: Deploy Docs

on:
  push:
    branches: [main]
    # The site's inputs (the same rule as ci_select.py's docs build): a merge
    # that touches none of them would redeploy the same site.
    paths:
      - docs/**
      - mkdocs.yml
      - packages/*/src/**
      - packages/*/README.md
      - packages/*/CHANGELOG.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force
