name: Type Check

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit; runs on
# main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which packages this change can affect (scripts/ci_select.py).
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install typecheck dependencies
        run: uv sync --group typecheck
      # ty runs from each package's directory, on its import package. The two
      # umbrellas (geotoolz, xrtoolz) hold no code and are skipped.
      - name: Typecheck the selected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.typecheck }}
        run: |
          status=0
          for package in $(jq -r '.[]' <<< "$PACKAGES"); do
            [[ "$package" == "geotoolz" || "$package" == "xrtoolz" ]] && continue
            module=$(basename "$(find "packages/$package/src" -mindepth 1 -maxdepth 1 -type d ! -name '*.egg-info' | head -1)")
            echo "::group::$package ($module)"
            (cd "packages/$package" && uv run --group typecheck ty check "src/$module") || status=1
            echo "::endgroup::"
          done
          exit $status
