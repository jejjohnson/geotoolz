name: Tests

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-packages --all-groups --all-extras
      # Fast tier only — `slow` / `integration` tests run manually via the
      # "Extended Tests" workflow (workflow_dispatch), never automatically.
      # Each package runs from its own directory so its pytest + coverage
      # config (markers, gates, bench ignores) applies unchanged.
      - name: Test geotoolz
        run: uv run pytest -v -m "not slow and not integration"
        working-directory: packages/geotoolz
      - name: Test geotoolz-patcher
        run: uv run pytest -v
        working-directory: packages/geotoolz-patcher
      # The all-extras run of the catalog suite: every extras-gated test must
      # actually run here, so a skip (a missing extra, a broken importorskip)
      # fails the job. base-install.yml covers the no-extras end.
      - name: Test geotoolz-catalog (all extras, no skips)
        run: |
          uv run pytest -v -rs | tee pytest.log
          if grep -q "^SKIPPED" pytest.log; then
            echo "::error::geotoolz-catalog tests skipped in the all-extras run"
            exit 1
          fi
        working-directory: packages/geotoolz-catalog
        env:
          HYPOTHESIS_PROFILE: ci
      # Time handling must not depend on the runner's local zone (#235):
      # rerun the catalog suite once in a zone with a UTC offset and DST.
      - name: Test geotoolz-catalog (TZ=America/New_York)
        if: matrix.python-version == '3.13'
        run: uv run pytest -q --no-cov
        working-directory: packages/geotoolz-catalog
        env:
          TZ: America/New_York
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/*/coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: packages/geotoolz/coverage.xml,packages/geotoolz-patcher/coverage.xml,packages/geotoolz-catalog/coverage.xml
          fail_ci_if_error: false
