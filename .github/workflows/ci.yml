name: Tests

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs (base = another feature branch) must
  # get the same checks as PRs into main.
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit; runs on
# main are never cancelled, so every merged commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this change runs (scripts/ci_select.py): on main every package on
  # 3.12 and 3.13; on a pull request, on 3.13, the packages the change can
  # reach through the package graph, and the repository and packaging checks
  # only when their inputs change.
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  # One job per package and Python version, in parallel. Each package runs from
  # its own directory, so its pytest and coverage config (markers, bench
  # ignores, filterwarnings, its own `fail_under` floor on its own source)
  # applies unchanged. Fast tier only: `slow` / `integration` tests run
  # manually via the "Extended Tests" workflow, never automatically.
  test:
    name: test (${{ matrix.package }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    # An explicit `shell: bash` runs steps with `-o pipefail` (the implicit
    # default is plain `bash -e`), so a failing pytest still fails the no-skip
    # check below through its `| tee`.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --all-packages --all-groups --all-extras
      # Every package except the umbrella and ops runs its all-extras suite with
      # no skips allowed: an extras-gated test must actually run here, so a
      # skip (a missing extra, a broken importorskip) fails the job.
      # base-install.yml covers the no-extras end.
      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          noskip=false
          case "$PACKAGE" in
            geotoolz-ops) args=(-v -m "not slow and not integration") ;;
            geotoolz) args=(-v) ;;
            geotoolz-products)
              # `slow` (wheel build), `live` (real APIs) and `integration`
              # (real public downloads) stay out of the fast tier.
              args=(-v -rs -m "not slow and not live and not integration")
              noskip=true ;;
            geotoolz-catalog)
              export HYPOTHESIS_PROFILE=ci
              args=(-v -rs)
              noskip=true ;;
            xrtoolz-ops)
              # its dask tests (`-m dask`) are part of this fast tier
              args=(-v -rs -m "not slow and not integration")
              noskip=true ;;
            *)
              args=(-v -rs)
              noskip=true ;;
          esac
          if [[ "$noskip" == "true" ]]; then
            uv run pytest "${args[@]}" | tee pytest.log
            if grep -q "^SKIPPED" pytest.log; then
              echo "::error::$PACKAGE tests skipped in the all-extras run"
              exit 1
            fi
          else
            uv run pytest "${args[@]}"
          fi
      # Time handling must not depend on the runner's local zone (#235):
      # rerun the catalog suite once in a zone with a UTC offset and DST.
      - name: Test geotoolz-catalog (TZ=America/New_York)
        if: matrix.package == 'geotoolz-catalog' && matrix.python == '3.13'
        run: uv run pytest -q --no-cov
        working-directory: packages/geotoolz-catalog
        env:
          TZ: America/New_York
      - name: Doctests (xrops.Operator, xrops.grad)
        if: matrix.package == 'xrtoolz-ops'
        run: uv run pytest --doctest-modules src/xrops/_src src/xrops/grad --no-cov -q
        working-directory: packages/xrtoolz-ops
      - name: Upload coverage report
        if: matrix.python == '3.13' && matrix.package != 'geotoolz' && matrix.package != 'xrtoolz'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python == '3.13' && matrix.package != 'geotoolz' && matrix.package != 'xrtoolz'
        uses: codecov/codecov-action@v7
        with:
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          fail_ci_if_error: false

  # The checks that read the docs or every package at once, so they belong to
  # no one package's job and run once here instead of inside every package
  # suite that carries them. They need every extra installed (geoproducts'
  # carbonmapper refuses to import without its own).
  checks:
    name: repo checks
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --all-groups --all-extras
      # docs/capabilities.md lists every public name; it must match the code,
      # and no two packages may export one bare name for different objects.
      - name: Capability index is current
        run: uv run python scripts/capabilities.py --check
      # Every Python example in the docs, notebooks and READMEs parses and
      # names only stack objects that exist (scripts/check_docs.py).
      - name: Docs examples are current
        run: uv run python scripts/check_docs.py
      # The three suites that scan the docs tree for stale paths and names.
      - name: Docs-path tests
        run: |
          for package in geotoolz-ops geotoolz-catalog geotoolz-patcher; do
            (cd "packages/$package" && uv run pytest -q --no-cov tests/test_docs_paths.py)
          done
      # Both lanes' dependency-rule guards read every package, so a change to
      # any one package runs them here rather than the two full suites.
      - name: Dependency rules
        run: |
          for package in geotoolz-ops xrtoolz-ops; do
            (cd "packages/$package" && uv run pytest -q --no-cov tests/test_dependency_rules.py)
          done
      - name: Family name parity between geoops and xrops
        run: uv run python scripts/family_parity.py --check
      - name: CI selection rules
        run: uv run pytest -q --no-cov -p no:cacheprovider scripts/tests

  # Every package builds (sdist, then wheel from the sdist), and every sdist
  # and wheel carries the license text.
  build:
    name: packaging
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Per-package LICENSE copies match the root LICENSE
        run: for f in packages/*/LICENSE; do cmp LICENSE "$f"; done
      - name: Build every package
        run: uv build --all-packages -o dist
      - name: Every sdist and wheel carries the license text
        run: |
          for f in dist/*.tar.gz; do tar tzf "$f" | grep -q '/LICENSE$' || { echo "no LICENSE in $f"; exit 1; }; done
          for f in dist/*.whl; do unzip -l "$f" | grep -q 'dist-info/licenses/LICENSE' || { echo "no LICENSE in $f"; exit 1; }; done

  # One stable check that summarises the jobs: it passes when every selected
  # job passed, or when the change needed none.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [changes, test, checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check the jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, test: $TEST, repo checks: $CHECKS, packaging: $BUILD"
          [[ "$CHANGES" == "success" ]] || exit 1
          for result in "$TEST" "$CHECKS" "$BUILD"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
