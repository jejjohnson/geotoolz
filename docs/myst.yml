# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: the home page, each
# package's overview, concepts, how-tos, tutorials and design pages, and the
# executed notebooks. The API reference is built separately by Zensical +
# mkdocstrings from mkdocs.yml and mounted at /reference/; the API pages it
# builds are excluded here. See docs/README.md.
#
# references.api points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s): a filesystem path is rejected and a
# file:// URL is silently ignored. scripts/build_docs.py serves the freshly
# built API site/ on this exact port, then rewrites the resulting localhost
# URLs to the deployed /reference/ path. Keep the port in sync with API_PORT
# in that script.
#
# mystmd builds flat URLs from file names and has no way to set a slug, so a
# second page with the same file name (each package's index.md and
# concepts.md, the design pages) is served at <name>-1/, <name>-2/, … in toc
# order; the nav shows each page's own title. Never link to such a URL by
# hand: link to the file, and the build resolves it.
# ---------------------------------------------------------------------------
