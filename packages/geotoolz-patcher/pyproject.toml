[project]
name = "geotoolz-patcher"
version = "0.14.1"
description = "Four-axis Patcher framework for geospatial fields — split a field (a geoarray.GeoArray or any lazy RasterSource) into local patches, run an operator per patch, stitch the outputs back into a global result."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["remote-sensing", "geospatial", "patching", "tiling", "stitching", "geoarray"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    # The carrier: raster fields take a `geoarray.RasterSource` (a
    # `GeoArray` or a lazy reader) and every raster patch, merge and wire
    # form is a `geoarray.GeoArray`. The [georeader] extra brings the
    # adapter (`source_to_georeader` / `from_georeader`) used at the engine
    # boundary below.
    "geotoolz-array[georeader]>=0.3.0",
    # The internal engine only, never in the public API: georeader's
    # `read_reproject` / `calculate_transform_window` / `window_from_polygon`
    # behind `ReprojectingRasterField`, and `compare_crs` in the coordinate
    # samplers; >=2.1 for the numpy-subclass GeoTensor the adapter targets.
    "georeader-spaceml>=2.1",
    "numpy>=1.26",
    # KDTree (PointDomain) + signal windows (Tukey/Gaussian).
    "scipy>=1.11",
    # `georeader.geotensor` imports `Self` from typing_extensions without
    # declaring it as a dep (upstream packaging bug in >=2.1). Pin it here
    # so a slim install (without optional extras that would otherwise drag
    # it in transitively) still works.
    "typing-extensions>=4.0",
    # Windowed reads in the matched-field / matched-patcher path import
    # `rasterio.windows` at module scope. georeader pulls rasterio in too,
    # but a module-scope import must not rely on a transitive dependency.
    "rasterio>=1.3",
    # CRS transforms in the coordinate samplers (`SpatialExplicitCoords`,
    # `SpatialAlongTrack`), pyproj CRS round-trips in PatchCache, and the
    # obstore COG reader's GeoKey decoding. A base dependency, so no extra
    # repeats it.
    "pyproj>=3.6",
]

[project.optional-dependencies]
# Each `Field` adapter under `geopatcher.fields` guards its import so
# the base install stays slim and the user only pays for the substrates
# they actually use.
grid = ["xarray>=2024.1"]
# `georeader-spaceml` (a base dependency) already requires geopandas and
# shapely, so a base install satisfies `[vector]` transitively. Keep the
# extra and the import guards anyway: they name what the vector adapter
# needs and stop the adapter silently breaking if georeader drops them.
vector = ["geopandas>=0.14", "shapely>=2.0"]
point = ["xvec>=0.4"]
xarray-raster = ["rioxarray>=0.15", "xarray>=2024.1"]
streaming = ["zarr>=3.0"]
dask = ["dask[bag]>=2024.8.3", "xarray>=2024.1"]
# JAX carriers for `batch_split` batches (`PatchBatch.patches.to_jax()`).
jax = ["geotoolz-array[jax]>=0.3.0"]
# Cloud-Optimized GeoTIFF field (`geopatcher.fields.CogField`) on the
# geotoolz-cloud COG engine (obstore pool + async-geotiff, batched range
# fetches).
cog = ["geotoolz-cloud[cog]>=0.6"]
patch-full = [
    "xarray>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "xvec>=0.4",
    "rioxarray>=0.15",
    "zarr>=3.0",
    "dask[bag]>=2024.8.3",
    "geotoolz-array[jax]>=0.3.0",
    "geotoolz-cloud[cog]>=0.6",
]
# Operator-graph bridge: pull in `pipekit` and the ~125-LOC wrappers in
# `geopatcher.integrations.pipekit` (GridSampler / ApplyToChips / MergePatches).
# The patcher core stays framework-free; only this integration module
# imports `pipekit.Operator`.
pipekit = ["pipekit>=0.0.2"]
# Training-data bridge: `geopatcher.integrations.train.XarrayWindowDataset`, a
# pipekit-train `TrainingDataset` of windows from lazy xarray / Zarr stores.
# It rides the Equinox adapter's Grain path, so the extra pulls that adapter
# (jax, equinox, optax, grain, orbax) with pipekit-train.
train = ["pipekit-train[equinox]>=0.0.2", "xarray>=2024.1", "zarr>=3.0"]

[project.urls]
Repository = "https://github.com/jejjohnson/geotoolz"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
    "hypothesis>=6.152.9",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.31",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "watermark>=2.4",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships.
    "pygments>=2.19,<2.21",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geopatcher"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Notebooks render to docs and use Greek/math glyphs in axis labels and prose.
# RUF001/002/003 flag them as ambiguous, which is noise here. Line-length
# (E501) is also relaxed because long dict / tuple literals in tutorials
# are clearer on one line than split.
"*.ipynb" = ["RUF001", "RUF002", "RUF003", "E501"]
# The diagram-generator script uses Greek/math glyphs in axis labels and
# titles for figure rendering — same noise as the notebooks.
"docs/assets/make_diagrams.py" = ["RUF001", "RUF002", "RUF003"]

# Reuse guard rails (see AGENTS.md, "Reuse before you write"): other
# packages are used through their public API, and object-store clients
# come from the one pool in geocloud.store.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"geoops._src".msg = "private to geoops: import its public API (docs/capabilities.md), or make the helper public there first"
"geocatalog._src".msg = "private to geocatalog: import its public API (docs/capabilities.md), or make the helper public there first"
"geocloud._src".msg = "private to geocloud: import its public API (docs/capabilities.md), or make the helper public there first"
"geoproducts._src".msg = "private to geoproducts: import its public API (docs/capabilities.md), or make the helper public there first"
"obstore.store.S3Store".msg = "take the client from geocloud.store.get_obstore (one pool per process)"
"obstore.store.GCSStore".msg = "take the client from geocloud.store.get_obstore (one pool per process)"
"obstore.store.AzureStore".msg = "take the client from geocloud.store.get_obstore (one pool per process)"
"obstore.store.HTTPStore".msg = "take the client from geocloud.store.get_obstore (one pool per process)"
"obstore.store.from_url".msg = "take the client from geocloud.store.get_obstore (one pool per process)"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Optional-extra backends (xarray, geopandas, xvec, rioxarray, zarr) are
# guarded with try/except ImportError. Without the extras installed in the
# typecheck env, ty can't resolve them — that's expected and fine.
unresolved-import = "ignore"
# `geopandas = None` after a failed import is intentional; ty doesn't
# track the typing-redefinition pattern.
invalid-assignment = "ignore"
# rasterio.windows.Window doesn't carry parameter names in its stub, so
# `Window(col_off=..., row_off=...)` looks like unknown kwargs to ty.
unknown-argument = "ignore"
# zarr.Group.__getitem__ stubs only accept `str`, but the streaming
# `OverlapAdd` path indexes into it with `slice(None)` / tuples to write
# back accumulator buffers — runtime-correct, stub-narrow. Same noise
# `gdf.index.left/right/overlaps` produces (real attrs on IntervalIndex,
# missing from the base Index stub).
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
filterwarnings = [
    # W2 (jejjohnson/geostack#67): no carrier in this package or its tests
    # takes its dims from the data's rank (geotoolz-array 0.3 deprecation).
    "error:GeoArray dims read from:DeprecationWarning",
]
testpaths = ["tests"]
addopts = "--cov=src/geopatcher --cov-report=term-missing --cov-report=xml:coverage.xml --strict-markers"

[tool.coverage.run]
source = ["src/geopatcher"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Some extras-gated paths skip in slim local runs — hence a floor below
# the ~78% an all-extras run measures.
# CI installs --all-extras, so the full suite runs there.
fail_under = 65
