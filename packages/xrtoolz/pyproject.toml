[project]
name = "xrtoolz"
version = "0.2.0"
description = "The xarray side of the geostack in one install: xrtoolz-ops, -products, -core and -grad."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["xarray", "earth-science", "geoprocessing", "climate", "oceanography"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# This distribution holds no code (#359): it installs the family, each
# package imported under its own name (see src/xrtoolz/__init__.py).
dependencies = [
    "xrtoolz-ops>=0.0.0",
    "xrtoolz-products>=0.0.2",
    "xrtoolz-core>=0.0.1",
    "xrtoolz-grad>=0.0.1",
]

[project.optional-dependencies]
wavelets = ["xrtoolz-ops[wavelets]"]
image = ["xrtoolz-ops[image]"]
maps = ["xrtoolz-ops[maps]"]
sklearn = ["xrtoolz-ops[sklearn]"]
vector = ["xrtoolz-ops[vector]"]

[project.urls]
Repository = "https://github.com/jejjohnson/xrtoolz"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xrtoolz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
