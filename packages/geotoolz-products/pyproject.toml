[project]
name = "geotoolz-products"
version = "0.2.0"
description = "Readers for Earth-observation data products — each mission or provider product as a georeader GeoData / GeoTensor."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
keywords = ["remote-sensing", "geospatial", "readers", "earth-observation", "georeader"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    # GeoTensor and the GeoData protocol every reader implements; >=2.1 for
    # the numpy-subclass GeoTensor.
    "georeader-spaceml>=2.1",
    "numpy>=1.26",
    # `georeader.geotensor` imports `Self` from typing_extensions without
    # declaring it (upstream packaging bug in >=2.1).
    "typing-extensions>=4.0",
    # rasterio windows / transforms and affine are imported at module top
    # level by the reader base class; declared directly rather than relying
    # on georeader-spaceml pulling them in.
    "rasterio>=1.3",
    "affine>=2.4",
]

[project.optional-dependencies]
# Pooled object-store client (``obstore``) for cloud-backed sensor reads:
# readers pointing at ``s3://`` / ``gs://`` / ``az://`` / ``https://``
# scenes call ``ProductReader.set_obstore_client(...)`` so every byte-range
# fetch goes through geotoolz-cloud's process-wide pool (`geocloud.store`,
# shared with geopatcher and geocatalog).
obstore = ["geotoolz-cloud"]
# Sensor presets (``<sensor>.presets``): geotoolz operators bound to a
# product's band names. geotoolz never depends on this package, so the
# extra adds no cycle.
operators = ["geotoolz"]
# Carbon Mapper reader (``geoproducts.carbonmapper``): the STAC + plume
# catalogue API client (requests), the typed plume record (pydantic), and
# the plume / source vector geometry (shapely, geopandas, pandas — also
# georeader dependencies, declared because the reader imports them
# directly).
# GOES-R ABI L1b reader (``geoproducts.goes``): ABI files are NetCDF-4,
# i.e. HDF5, read chunk-by-chunk through h5py. The NOAA bucket helpers
# (``goes.aws``) are standard library and need no extra.
goes = ["h5py>=3.10"]
# Himawari AHI (``geoproducts.himawari``): the HSD L1b reader and the bucket
# helpers are numpy + standard library; h5py is only for the NOAA L2 cloud
# products (NetCDF-4).
himawari = ["h5py>=3.10"]
carbonmapper = [
    "requests>=2",
    "pydantic>=2",
    "shapely>=2",
    "geopandas>=0.14",
    "pandas>=2.1",
]

[project.urls]
Repository = "https://github.com/jejjohnson/geotoolz"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoproducts"]
artifacts = ["src/geoproducts/*/data/**"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# The Carbon Mapper modules document units and shapes with math glyphs
# (σ, ×, en-dashes); RUF001/002/003 flag them as ambiguous, which is noise
# here (same relaxation as the geotoolz operator families).
"src/geoproducts/carbonmapper/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/carbonmapper/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Optional extras (obstore, geotoolz, the carbonmapper clients) are guarded;
# without them in the typecheck env ty cannot resolve them.
unresolved-import = "ignore"
# rasterio.windows.Window doesn't carry parameter names in its stub.
unknown-argument = "ignore"
# georeader's `read.read_from_*` helpers are annotated `GeoData | ndarray`
# although they return a GeoTensor for an in-memory or loaded read (same
# rule as geotoolz, where this code lived before).
invalid-return-type = "ignore"
# Payload dicts splatted into pydantic models (`CMRawPlume(**rec)`) and
# georeader's narrow `GeoData` parameter stubs (same rule as the other
# workspace packages).
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/geoproducts --cov-report=term-missing --cov-report=xml:coverage.xml --strict-markers"
markers = [
    "slow: builds artifacts or otherwise takes long; deselected in CI's fast tier",
    "live: calls a real external API (needs credentials / network); always deselected in CI",
    "integration: downloads real public data (no credentials); run manually via the Extended Tests workflow",
]

[tool.coverage.run]
source = ["src/geoproducts"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
