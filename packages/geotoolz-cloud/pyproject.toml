[project]
name = "geotoolz-cloud"
version = "0.2.0"
description = "Cloud object storage for the geotoolz stack — one process-wide obstore client pool and batched, async Cloud-Optimized GeoTIFF reads."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "../../LICENSE" }
readme = "README.md"
keywords = ["remote-sensing", "geospatial", "cloud", "object-storage", "cog", "obstore", "georeader"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    # The pooled S3 / GCS / Azure / HTTP clients (`geocloud.store`).
    "obstore>=0.9.5",
    # GeoTensor, the GeoData surface and `georeader.read`, which the COG
    # reader mirrors; >=2.1 for the numpy-subclass GeoTensor.
    "georeader-spaceml>=2.1",
    "numpy>=1.26",
    # `georeader.geotensor` imports `Self` from typing_extensions without
    # declaring it (upstream packaging bug in >=2.1).
    "typing-extensions>=4.0",
    # Windows / transforms / resampling, imported at module scope by the
    # COG reader; declared rather than relied on through georeader.
    "rasterio>=1.3",
]

[project.optional-dependencies]
# Cloud-Optimized GeoTIFF reads (`geocloud.cog`): async-geotiff (over
# async-tiff) parses the COG header, georeferencing, CRS, overviews and
# masks and decodes tile bytes without GDAL. Pre-1.0, so capped to the
# tested minor; it requires numpy>=2.
cog = ["async-geotiff>=0.5,<0.6"]

[project.urls]
Repository = "https://github.com/jejjohnson/geotoolz"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocloud"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]
ignore = ["E402", "E721", "E731", "E741"]

# Reuse guard rails (see AGENTS.md, "Reuse before you write"): other
# packages are used through their public API, and object-store clients
# come from the one pool in geocloud.store.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"geotoolz._src".msg = "private to geotoolz: import its public API (docs/capabilities.md), or make the helper public there first"
"geopatcher._src".msg = "private to geopatcher: import its public API (docs/capabilities.md), or make the helper public there first"
"geocatalog._src".msg = "private to geocatalog: import its public API (docs/capabilities.md), or make the helper public there first"
"geoproducts._src".msg = "private to geoproducts: import its public API (docs/capabilities.md), or make the helper public there first"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# async-geotiff is an optional extra; without it in the typecheck env ty
# cannot resolve it.
unresolved-import = "ignore"
# rasterio.windows.Window doesn't carry parameter names in its stub.
unknown-argument = "ignore"
# georeader's narrow `GeoData` parameter / return stubs (same rule as the
# other workspace packages).
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/geocloud --cov-report=term-missing --cov-report=xml:coverage.xml --strict-markers"

[tool.coverage.run]
source = ["src/geocloud"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
