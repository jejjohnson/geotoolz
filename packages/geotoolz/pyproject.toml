[project]
name = "geotoolz"
version = "0.11.0"
description = "The geostack in one install: geotoolz-ops, -patcher, -catalog, -cloud and -products."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["remote-sensing", "geospatial", "operators", "pipelines", "georeader"]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# The umbrella holds no code: it installs the five packages, each imported
# under its own name (geoops, geopatcher, geocatalog, geocloud, geoproducts).
# Lower bounds only: workspace siblings released in lockstep.
dependencies = [
    "geotoolz-ops>=0.10.3",
    "geotoolz-patcher>=0.10.2",
    "geotoolz-catalog>=0.5.1",
    "geotoolz-cloud>=0.4.1",
    "geotoolz-products>=0.4.2",
    "geotoolz-array>=0.1.1",
]

# Extras forward to the package that owns them, so `pip install
# 'geotoolz[viz]'` and `pip install 'geotoolz-ops[viz]'` install the same thing.
[project.optional-dependencies]
viz = ["geotoolz-ops[viz]"]
learn = ["geotoolz-ops[learn]"]
hydra = ["geotoolz-ops[hydra]"]
vector-cube = ["geotoolz-ops[vector-cube]"]
zarr = ["geotoolz-ops[zarr]"]
hdf5 = ["geotoolz-ops[hdf5]"]
hdf4 = ["geotoolz-ops[hdf4]"]
netcdf = ["geotoolz-ops[netcdf]"]
patch = ["geotoolz-ops[patch]"]
operators = ["geotoolz-products[operators]"]

[project.urls]
Repository = "https://github.com/jejjohnson/geotoolz"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotoolz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
