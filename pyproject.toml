[project]
name = "geotoolz-monorepo"
version = "0.0.0"
description = "geotoolz monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
geotoolz = { workspace = true }
geotoolz-ops = { workspace = true }
geotoolz-patcher = { workspace = true }
geotoolz-catalog = { workspace = true }
geotoolz-products = { workspace = true }
geotoolz-cloud = { workspace = true }
geotoolz-array = { workspace = true }
# The Operator / Sequential / Graph composition core lives in the pipekit
# monorepo, which is not on PyPI (the PyPI name `pipekit` is another
# project), so it comes from GitHub at a release tag; the published wheel
# metadata still carries the PyPI-flavoured `pipekit>=…` requirement from
# each member's [project] table.
# pipekit#117 (on_import, lazy DimArray registration) until its release: then
# back to the release tags
pipekit = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit", rev = "8faf653e02ed800d4695bfbbf321b4b39c29cbe6" }
pipekit-array = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-array", rev = "8faf653e02ed800d4695bfbbf321b4b39c29cbe6" }
pipekit-train = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-train", rev = "8faf653e02ed800d4695bfbbf321b4b39c29cbe6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    # The umbrella's import-contract tests run lint-imports (#481).
    "import-linter>=2.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    # Property-based suites in geotoolz-patcher and geotoolz-catalog.
    "hypothesis>=6.152.9",
    # geotoolz-catalog test fixtures (NetCDF/HDF round-trips + bench gate).
    "h5netcdf>=1.3",
    "h5py>=3.10",
    "pytest-benchmark>=4.0",
    # Workspace members are dev-installed so tests can import them. The
    # geotoolz extras the test suite exercises (hydra-zen config
    # round-trips, xvec point extraction, netCDF4 / zarr I/O, obstore
    # pooling) come with them, so a plain `uv sync` runs the same fast
    # tier as CI's `--all-extras`.
    "geotoolz-ops[hydra,vector-cube,netcdf,zarr]",
    # Reference solar geometry for radiometry.ComputeSZA (no geotoolz
    # extra declares it).
    "pysolar>=0.11",
    "geotoolz-cloud[cog]",
    "geotoolz-patcher",
    "geotoolz-catalog",
    "geotoolz-products[operators]",
    # The carrier package with every extra, so its JAX tests run in the
    # fast tier instead of skipping.
    "geotoolz-array[jax,vector,georeader,xarray]",
]
lint = [
    "import-linter>=2.1",
    "ruff>=0.15.11",
]
typecheck = [
    "ty>=0.0.35",
]
docs = [
    # mkdocstrings imports the packages to render API pages.
    "geotoolz-ops",
    "geotoolz-patcher",
    "geotoolz-catalog",
    "geotoolz-products",
    "geotoolz-cloud",
    "geotoolz-array",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-jupyter>=0.26.3",
    "jupytext>=1.19.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships.
    "pygments>=2.19,<2.22",
    "mkdocs-redirects>=1.2.2",
]

# Root-level lint config applies to files outside packages/*; each member
# package keeps its own [tool.ruff] (ruff's nearest-pyproject discovery
# scopes per-package ignores like geotoolz's jaxtyping F722 correctly).
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["RUF001", "RUF002", "RUF003", "E501"]
# Diagram-generator scripts (moved in from the package doc trees) use
# Greek/math glyphs in axis labels and titles — same noise as notebooks.
"docs/*/assets/make_diagrams.py" = ["RUF001", "RUF002", "RUF003"]
"docs/assets/make_diagrams.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
# The workspace sources live under packages/*/src, so root-level files
# (docs notebooks) need the first-party classification made explicit.
known-first-party = ["geotoolz", "geoops", "geopatcher", "geocatalog", "geoarray"]

[tool.ty.environment]
python-version = "3.12"

# Import contracts (`make imports`, run in CI's test job), checked with
# import-linter over every geotoolz package, imports inside functions included.
[tool.importlinter]
root_packages = ["geoops", "geopatcher", "geocatalog", "geocloud", "geoproducts", "geoarray"]
include_external_packages = true

# plumax and radtrax depend on geotoolz through their `[geo]` extras, so an
# import back would close a cycle (geostack docs/geomodels/package_boundaries.md,
# rule 1; gate P2).
[[tool.importlinter.contracts]]
name = "geotoolz never imports plumax or radtrax"
type = "forbidden"
source_modules = ["geoops", "geopatcher", "geocatalog", "geocloud", "geoproducts", "geoarray"]
forbidden_modules = ["plumax", "radtrax"]

# The I/O packages are pre- and post-processing and never use JAX or coordax
# themselves (#528, gate G4). Direct imports only: they reach geoarray, which
# registers its pytrees when JAX is installed.
[[tool.importlinter.contracts]]
name = "catalog, cloud and products never import JAX or coordax"
type = "forbidden"
source_modules = ["geocatalog", "geocloud", "geoproducts"]
forbidden_modules = ["jax", "jaxlib", "coordax"]
allow_indirect_imports = true
