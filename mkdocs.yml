# ---------------------------------------------------------------------------
# Zensical builds ONLY the API reference from this file (it reads mkdocs.yml
# as is), and it is deployed as the `/reference/` subtree of the MyST site.
# The home page, concepts, how-tos, tutorials, design pages and notebooks are
# built by mystmd from `docs/myst.yml`. See `docs/README.md` for the split.
#
# The API pages stay where each package's docs keep them (`docs/<pkg>/api/`,
# and `api.md` for the single-page packages), which the scripts that check and
# generate them read. Zensical reads `docs/` and `exclude_docs` leaves out
# everything else, so the reference mirrors the source tree and every relative
# link in an API page means what it says; links into prose pages are rewritten
# to the MyST pages by `scripts/build_docs.py`. `docs/api/index.md` is the
# overview, served at `/reference/api/`.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: geotoolz API reference
site_description: API reference for the geostack packages (geoops, geopatcher, geocatalog, geocloud, geoproducts, geoarray and the xrtoolz xarray lane), generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/geotoolz
repo_name: jejjohnson/geotoolz

docs_dir: docs
site_dir: site

# gitignore syntax: drop everything, then re-include only the API pages.
exclude_docs: |
  /*
  !/api/
  !/javascripts/
  !/assets/
  /assets/*
  !/assets/icon.svg
  !/operators/
  /operators/*
  !/operators/api/
  !/patcher/
  /patcher/*
  !/patcher/api/
  !/catalog/
  /catalog/*
  !/catalog/api/
  !/xarray/
  /xarray/*
  !/xarray/api/
  !/array/
  /array/*
  !/array/api/
  !/array/api.md
  !/cloud/
  /cloud/*
  !/cloud/api.md
  !/products/
  /products/*
  !/products/api.md

# The guide pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. `scripts/build_docs.py` rewrites them to the
# pages mystmd built and then validates every link in the assembled site,
# across both halves, which neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore
    not_found: ignore

theme:
  name: material
  # Zensical's Material-compatible look; `modern` is its newer default.
  variant: classic
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/geotoolz-ops/src
            - packages/geotoolz-patcher/src
            - packages/geotoolz-catalog/src
            - packages/geotoolz-cloud/src
            - packages/geotoolz-products/src
            - packages/geotoolz-array/src
            - packages/xrtoolz-ops/src
            - packages/xrtoolz-products/src
          options:
            docstring_style: google
            # Parse `Returns:  X: desc` as *type: description* (not as a
            # named value), so typed return docstrings resolve cleanly.
            docstring_options:
              returns_named_value: false
            show_source: true
            show_root_heading: true
            # geoarray re-exports functax's affine kernels (`to_pixel`);
            # griffe must load functax to resolve those aliases.
            # xrops re-exports xrproducts names (subset_bbox, …); preload it
            # so griffe can resolve those aliases.
            preload_modules:
              - functax
              - xrproducts

nav:
  - Overview: api/index.md
  - geoops (geotoolz-ops):
      - Core: operators/api/core.md
      - Carrier & contract checks: operators/api/carrier.md
      - Backends: operators/api/backends.md
      - Coupling: operators/api/coupling.md
      - Augment: operators/api/augment.md
      - Compositing: operators/api/compositing.md
      - Einx: operators/api/einx.md
      - Feature: operators/api/feature.md
      - Geometry: operators/api/geom.md
      - Indices: operators/api/indices.md
      - IO: operators/api/io.md
      - Learn (scikit-learn): operators/api/learn.md
      - Mask: operators/api/mask.md
      - Matched filter: operators/api/matched_filter.md
      - Measure: operators/api/measure.md
      - Normalize: operators/api/normalize.md
      - Plume: operators/api/plume.md
      - QA: operators/api/qa.md
      - Radiometry: operators/api/radiometry.md
      - Restore: operators/api/restore.md
      - Segment: operators/api/segment.md
      - Spectral: operators/api/spectral.md
      - Viz: operators/api/viz.md
  - geopatcher:
      - Overview: patcher/api/reference.md
      - Core: patcher/api/core.md
      - Spatial axes: patcher/api/spatial.md
      - Temporal axes: patcher/api/temporal.md
      - Fields: patcher/api/fields.md
      - Matched multi-source: patcher/api/matched.md
      - Running at scale: patcher/api/run.md
      - Observing: patcher/api/observe.md
      - Config: patcher/api/config.md
      - Integrations: patcher/api/integrations.md
  - geocatalog:
      - Overview: catalog/api/reference.md
      - Core: catalog/api/core.md
      - Sources: catalog/api/sources.md
      - Build: catalog/api/build.md
      - Backends: catalog/api/backends.md
      - Matchup: catalog/api/matchup.md
      - Load: catalog/api/load.md
      - States: catalog/api/states.md
      - Storage: catalog/api/storage.md
      - Staging: catalog/api/staging.md
      - Patch: catalog/api/patch.md
      - Grid: catalog/api/grid.md
      - Utils: catalog/api/utils.md
  - geocloud: cloud/api.md
  - geoproducts: products/api.md
  - geoarray:
      - geoarray: array/api.md
      - geoarray.coords: array/api/coords.md
      - geoarray.types: array/api/types.md
  - xarray lane (xrops, xrproducts):
      - Overview: xarray/api/index.md
      - Composition: xarray/api/composition.md
      - Geoprocessing:
          - Validation & Coordinates: xarray/api/geo/coords.md
          - Subsetting, Regions & Masks: xarray/api/geo/subset.md
          - CRS & Reprojection: xarray/api/geo/crs.md
          - Climatology & Anomalies: xarray/api/geo/climatology.md
          - Wavelet Analysis: xarray/api/geo/wavelet.md
          - Extremes: xarray/api/geo/extremes.md
      - Numerics:
          - Calculus (xrops.grad): xarray/api/calc.md
          - Transforms: xarray/api/transforms.md
          - Encoders: xarray/api/encoders.md
          - Interpolation: xarray/api/interpolate.md
      - Domain Physics:
          - Oceanography: xarray/api/ocn.md
          - Atmosphere: xarray/api/atm.md
      - Diagnostics:
          - Metrics: xarray/api/metrics.md
          - Budgets: xarray/api/budgets.md
      - Data Acquisition:
          - Archive Readers (xrproducts): xarray/api/reader.md
      - Bridges & Integration:
          - scikit-learn on xarray (xrops.learn): xarray/api/learn.md
          - Inference: xarray/api/inference.md
          - Visualization: xarray/api/viz.md
          - Utilities: xarray/api/utils.md
          - Families of geoops and xrops: xarray/api/families.md
          - Lifting geoops operators (xrops.lift): xarray/api/lift.md

markdown_extensions:
  # docs/hooks/xarray_options.py: xrtoolz's mkdocstrings options on the
  # xrops / xrproducts directives (scripts/build_docs.py puts docs/hooks on
  # PYTHONPATH).
  - xarray_options
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
