site_name: geotoolz
site_description: The geostack — find, read, cut and compute on Earth-observation data, one composable stack of five packages.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/geotoolz
repo_name: jejjohnson/geotoolz

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/geotoolz/src
            - packages/geotoolz-patcher/src
            - packages/geotoolz-catalog/src
            - packages/geotoolz-cloud/src
            - packages/geotoolz-products/src
          options:
            docstring_style: google
            # Parse `Returns:  X: desc` as *type: description* (not as a
            # named value), so typed return docstrings resolve cleanly.
            docstring_options:
              returns_named_value: false
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
  # The operator pages moved under operators/ (one folder per package);
  # the old URLs keep working.
  - redirects:
      redirect_maps:
        concepts.md: operators/concepts.md
        quickstart.md: operators/quickstart.md
        normalization.md: operators/normalization.md
        patch_ops.md: operators/patch_ops.md
        io.md: operators/io.md
        recipes/define-an-operator.md: operators/how-to/define-an-operator.md
        recipes/branching-pipelines.md: operators/how-to/branching-pipelines.md
        recipes/integration-with-geocatalog-and-geopatcher.md: operators/how-to/integration-with-geocatalog-and-geopatcher.md
        api/augment.md: operators/api/augment.md
        api/carrier.md: operators/api/carrier.md
        api/compositing.md: operators/api/compositing.md
        api/core.md: operators/api/core.md
        api/einx.md: operators/api/einx.md
        api/feature.md: operators/api/feature.md
        api/geom.md: operators/api/geom.md
        api/indices.md: operators/api/indices.md
        api/io.md: operators/api/io.md
        api/learn.md: operators/api/learn.md
        api/mask.md: operators/api/mask.md
        api/matched_filter.md: operators/api/matched_filter.md
        api/measure.md: operators/api/measure.md
        api/normalize.md: operators/api/normalize.md
        api/plume.md: operators/api/plume.md
        api/qa.md: operators/api/qa.md
        api/radiometry.md: operators/api/radiometry.md
        api/restore.md: operators/api/restore.md
        api/segment.md: operators/api/segment.md
        api/spectral.md: operators/api/spectral.md
        api/viz.md: operators/api/viz.md
        design/query-matchup.md: catalog/design/query-matchup.md
        patcher/design/query-matchup.md: catalog/design/query-matchup.md

# Contributor tooling, not site pages.
exclude_docs: |
  templates/
  *.py

